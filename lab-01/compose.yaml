name: margosha-cat-lab
services:
  app:
    container_name: app
    build: .
    image: cat-lab:lab01
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: postgresql://margosha:${POSTGRES_PASSWORD}@db:5432/cat_shop
    depends_on:
      db:
        condition: service_healthy

  db:
    container_name: db
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cat_shop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: margosha
    volumes:
      - catdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U margosha -d cat_shop"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s


volumes:
  catdata:
