name: install
description: Install app dependencies

inputs:
  python-version:
    description: Python version to be installed
    required: false
    default: '3.12'
  working-directory:
    description: the folder with requirements*.txt files
    required: true

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        shopt -s nullglob
        files=(requirements*.txt)
        if [ ${#files[@]} -eq 0 ]; then
          echo "::error::no requirements*.txt in ${{ inputs.working-directory }}"
          exit 1
        fi
        args=()
        for f in "${files[@]}"; do
          args+=(-r "$f"); done
        pip install "${args[@]}"
