name: publish-lab-03

on:
  push:
    paths:
      - "lab-03/**"
      - ".github/workflows/publish-lab-03.yml"
      - ".github/workflows/_build-and-test.yml"
      - ".github/actions/install-and-test/**"
  pull_request:
    paths:
      - "lab-03/**"
      - ".github/workflows/publish-lab-03.yml"
      - ".github/workflows/_build-and-test.yml"
      - ".github/actions/install-and-test/**"
  workflow_dispatch:

permissions: {}

jobs:
  resolve-owner:
    runs-on: ubuntu-24.04
    outputs:
      owner: ${{ steps.resolve-owner.outputs.owner }}
    steps:
      - id: resolve-owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

  build-and-test:
    needs: resolve-owner
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build-and-test.yml
    with:
      working-directory: lab-03
      image: ghcr.io/${{ needs.resolve-owner.outputs.owner }}/catshop-lab-03
      tag: ${{ github.sha }}
      publish: ${{ github.event_name != 'pull_request' }}

  report-back:
    needs: build-and-test
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "digest ${{ needs.build-and-test.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "ref ${{ needs.build-and-test.outputs.ref }}" >> "$GITHUB_STEP_SUMMARY"
          echo "tag ${{ needs.build-and-test.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"