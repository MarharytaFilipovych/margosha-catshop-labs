name: publish-lab-02

on:
  push:
    paths:
      - "lab-02/**"
      - ".github/workflows/publish-lab-02.yml"
  pull_request:
    paths:
      - "lab-02/**"
      - ".github/workflows/publish-lab-02.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: lab-02
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            lab-02/requirements.txt
            lab-02/requirements-dev.txt
      - name: Install the required dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest tests -q

  publish:
    permissions:
      contents: read
      packages: write
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - id: meta
        name: Resolve the image names and decide whether to publish
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          ghcr="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/catshop-lab-02:${GITHUB_SHA}"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/catshop-lab-02" >> "$GITHUB_OUTPUT"
          # publish on pushes to this repo; pull requests (forks included, no secrets there) only build
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            {
              echo "tags<<EOF"
              echo "$ghcr"
              echo "docker.io/${DOCKERHUB_USERNAME,,}/catshop-lab-02:${GITHUB_SHA}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "tags=$ghcr" >> "$GITHUB_OUTPUT"
          fi
      - name: Log in to GHCR
        if: steps.meta.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        if: steps.meta.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build the image for the smoke test
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: lab-02
          load: true
          tags: catshop-lab-02:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test /health and /visits endpoints
        run: |
          docker run --rm -d --name shop -p 8080:8080 catshop-lab-02:${{ github.sha }}
          for i in $(seq 1 20); do curl -fsS localhost:8080/health && break; sleep 1; done
          curl -fsS localhost:8080/health
          curl -fsS localhost:8080/visits
          docker rm -f shop
      - id: push
        name: Build and push the final image
        uses: docker/build-push-action@v6
        with:
          context: lab-02
          push: ${{ steps.meta.outputs.publish == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
      - name: Print the published digest
        if: steps.meta.outputs.publish == 'true'
        run: |
          echo "published ${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}"
