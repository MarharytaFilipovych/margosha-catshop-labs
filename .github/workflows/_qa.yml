name: QA suite

on:
  workflow_call:
    inputs:
      profile:
        description: QA profile. Can be empty (the default) or 'partner'
        required: false
        type: string
        default: ''
      suite-directory:
        description: the folder that contains the qa suite with compose.qa.yaml
        required: true
        type: string
      image-ref:
        description: image@digest
        required: true
        type: string

    secrets:
      registry-token:
        required: false

permissions:
  contents: read
  packages: read

env:
  COMPOSE_PROFILES: ${{ inputs.profile }}
  QA_PROFILE: ${{ inputs.profile }}
  QA_BASE_URL: ${{ inputs.host }}
  COMPOSE_FILE: ${{ inputs.suite-directory }}/compose.qa.yaml
  QA_IMAGE: ${{ inputs.image-ref }}

jobs:
  qa:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Python and dependencies
        uses: ./.github/actions/install
        with:
          working-directory: ${{ inputs.suite-directory }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.registry-token || secrets.GITHUB_TOKEN }}

      - name: Pull the image
        shell: bash
        run: docker pull "$QA_IMAGE"

      - name: Run compose
        shell: bash
        run: docker compose up -d --wait

      - name: Run test suite
        shell: bash
        run: python -m pytest ${{ inputs.suite-directory }} -q

      - name: Get logs on failure
        if: failure()
        shell: bash
        run: docker compose logs

      - name: Tear stack down
        if: always()
        shell: bash
        run: docker compose down -v
